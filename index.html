<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题库检索</title>
<style>
/* SECTION: base */
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f6f8;color:#1c1f23;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{padding:14px 14px 40px}
.wrap{max-width:920px;margin:0 auto;min-width:0}
h1{font-size:17px;margin:0 0 10px;font-weight:600;color:#2a2f37}
h1 span{font-weight:400;color:#7a828e;font-size:13px;margin-left:8px}

/* SECTION: search */
.searchbar{position:sticky;top:0;z-index:10;background:#f5f6f8;padding:6px 0 10px}
input#q{width:100%;min-height:52px;font-size:17px;padding:12px 44px 12px 14px;
  border:1px solid #d3d8e0;border-radius:10px;background:#fff;outline:none;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
input#q:focus{border-color:#3061d0;box-shadow:0 0 0 3px rgba(48,97,208,.12)}
.clear{position:absolute;right:10px;top:16px;width:32px;height:32px;border:0;border-radius:8px;
  background:#eef1f5;color:#69707c;font-size:16px;cursor:pointer;display:none}
.clear.show{display:block}

/* SECTION: meta */
.meta{font-size:12.5px;color:#7a828e;margin:0 0 10px;line-height:1.6}
.meta b{color:#3061d0}

/* SECTION: results */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:1px solid #e3e7ee;border-radius:10px;padding:12px 14px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);min-width:0}
.card.sel{border-color:#3061d0;box-shadow:0 0 0 3px rgba(48,97,208,.12)}
.card .top{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;min-width:0}
.tag{flex:0 0 auto;font-size:11.5px;padding:2px 7px;border-radius:5px;background:#eef2fb;color:#3d63b8}
.tag.j{background:#f2eefb;color:#6b46b8}
.tag.p{background:#eef8f1;color:#2f7d4f}
.stem{flex:1 1 240px;font-size:15px;line-height:1.65;min-width:0}
.ans{margin:9px 0 0;font-size:19px;font-weight:700;color:#127a46;letter-spacing:.4px;
  cursor:pointer;user-select:all}
.ans .hint{font-size:11.5px;font-weight:400;color:#8b93a0;margin-left:8px}
.opts{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.opts li{font-size:13.5px;color:#5c6470;line-height:1.55;padding:2px 6px;border-radius:5px;
  overflow-wrap:anywhere}
.opts li.ok{background:#eaf7ef;color:#1a6b3f;font-weight:600}
.kp{margin:8px 0 0;font-size:11.5px;color:#98a0ac}
.empty{text-align:center;color:#98a0ac;font-size:14px;padding:36px 10px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1c1f23;color:#fff;
  font-size:13px;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.92}
@media(max-width:560px){
  body{padding:10px 10px 30px}
  .stem{font-size:14.5px}
  .ans{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>题库检索<span>离线可用 · 无需联网</span></h1>
  <!-- SECTION: search -->
  <div class="searchbar">
    <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="粘贴或输入题目片段，自动模糊匹配">
    <button class="clear" id="clear" type="button" aria-label="清空">×</button>
  </div>
  <!-- SECTION: meta -->
  <div class="meta" id="meta"></div>
  <!-- SECTION: results -->
  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast"></div>

function norm(s){
  return String(s||'').replace(/_{2,}/g,'').replace(/[（）()【】\[\]、，。．\.？?：:；;“”"'‘’\s]/g,'');
}
function dice(a,b){
  if(a===b) return 1;
  if(a.length<2||b.length<2) return a===b?1:0;
  var m={},hit=0,i,k;
  for(i=0;i<a.length-1;i++){k=a.substr(i,2);m[k]=(m[k]||0)+1;}
  for(i=0;i<b.length-1;i++){k=b.substr(i,2);if(m[k]>0){m[k]--;hit++;}}
  return 2*hit/(a.length+b.length-2);
}
function search(q){
  var n=norm(q);
  if(!n) return [];
  var out=[],i,it,ns,sc,idx;
  for(i=0;i<DATA.length;i++){
    it=DATA[i]; ns=it.n;
    if(ns===n){ sc=1; }
    else {
      idx=ns.indexOf(n);
      if(idx>=0){ sc=0.9+0.1*(n.length/Math.max(ns.length,1)); }
      else { sc=dice(n,ns); }
    }
    if(sc>=0.34) out.push([sc,it]);
  }
  out.sort(function(a,b){return b[0]-a[0];});
  return out.slice(0,30);
}

}

  card.appendChild(ans);

  if(it.o&&it.o.length){
    var ul=document.createElement('ul');
    ul.className='opts';
    var letters=(it.a||'').replace(/[^A-D]/g,'');
    for(var i=0;i<it.o.length;i++){
      var li=document.createElement('li');
      var op=it.o[i];
      li.textContent=op;
      if(letters.indexOf(op.charAt(0))>=0) li.className='ok';
      ul.appendChild(li);
    }
    card.appendChild(ul);
  }

  if(it.k){
    var kp=document.createElement('div');
    kp.className='kp';
    kp.textContent='知识点：'+it.k;
    card.appendChild(kp);
  }
  return card;
}
function paint(res){
  current=res;
  listEl.innerHTML='';
  selIdx=0;
  if(!res.length){
    var e=document.createElement('div');
    e.className='empty';
    e.textContent=inputEl.value?'没有匹配到题目，换个关键词试试':'输入题目片段开始检索';
    listEl.appendChild(e);
    metaEl.textContent='题库共 '+DATA.length+' 题';
    return;
  }
  metaEl.innerHTML='';
  metaEl.appendChild(document.createTextNode('找到 '+res.length+' 条相关题目，题库共 '));
  var b=document.createElement('b');
  b.textContent=DATA.length;
  metaEl.appendChild(b);
  metaEl.appendChild(document.createTextNode(' 题'));

  for(var i=0;i<res.length;i++){
    var c=renderCard(res[i][1],res[i][0]);
    if(i===0) c.classList.add('sel');
    c.addEventListener('click',function(){});
    listEl.appendChild(c);
  }
}
function refresh(){
  var q=inputEl.value;
  clearEl.classList.toggle('show',!!q);
  if(!q.trim()){paint([]);return;}
  paint(search(q));
}
var timer=null;
inputEl.addEventListener('input',function(){
  clearTimeout(timer);
  timer=setTimeout(refresh,90);
});
clearEl.addEventListener('click',function(){
  inputEl.value='';refresh();inputEl.focus();
});
document.addEventListener('keydown',function(e){
  var cards=listEl.querySelectorAll('.card');
  if(!cards.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    cards[selIdx]&&cards[selIdx].classList.remove('sel');
    selIdx=e.key==='ArrowDown'?Math.min(selIdx+1,cards.length-1):Math.max(selIdx-1,0);
    cards[selIdx].classList.add('sel');
    cards[selIdx].scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'&&current[selIdx]){
    e.preventDefault();
    copyText(current[selIdx][1].a);
  }
});

/* SECTION: init */
paint([]);
inputEl.focus();
</script>
</body>
</html>
